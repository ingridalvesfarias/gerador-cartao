<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Interativo de Cartão de Visita | Portfólio Ingrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="controls-panel">
            <header>
                <h1>Card<span class="accent">Forge</span></h1>
                <p>Crie seu cartão de visita profissional</p>
            </header>

            <form class="editor-form">
                <div class="input-group">
                    <label for="nameInput">Nome Completo</label>
                    <input type="text" id="nameInput" placeholder="Ex: Ingrid Farias" maxlength="25">
                </div>

                <div class="input-group">
                    <label for="roleInput">Cargo ou Título</label>
                    <input type="text" id="roleInput" placeholder="Ex: Philosophy & Tech" maxlength="30">
                </div>

                <div class="input-group">
                    <label for="emailInput">E-mail</label>
                    <input type="email" id="emailInput" placeholder="Ex: contato@ingrid.dev">
                </div>

                <div class="input-group">
                    <label for="phoneInput">Telefone/WhatsApp</label>
                    <input type="tel" id="phoneInput" placeholder="Ex: (85) 99999-9999">
                </div>

                <div class="input-group-row">
                    <div class="input-group">
                        <label for="colorPicker">Cor de Destaque</label>
                        <input type="color" id="colorPicker" value="#d4a373">
                    </div>
                    <div class="input-group">
                        <label for="bgPicker">Cor do Cartão</label>
                        <input type="color" id="bgPicker" value="#161616">
                    </div>
                </div>

                <button type="button" class="btn-primary" id="downloadBtn">Salvar como Imagem (PDF)</button>
            </form>
        </aside>

        <main class="preview-area">
            <div class="card-perspective">
                <div class="business-card" id="businessCard">
                    <div class="card-front">
                        <div class="card-content">
                            <h2 class="card-name" id="previewName">Seu Nome Aqui</h2>
                            <p class="card-role" id="previewRole">Seu Cargo ou Título</p>
                            <div class="card-separator"></div>
                            <div class="card-contact-info">
                                <p id="previewEmail">📧 contato@seu-email.com</p>
                                <p id="previewPhone">📞 (00) 00000-0000</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <p class="help-text">O preview é atualizado em tempo real.</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
